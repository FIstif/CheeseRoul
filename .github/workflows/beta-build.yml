name: Beta CI/CD Build

on:
  push:
    branches: [ "develop" ]

jobs:
  build-beta:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Beta APK
        run: ./gradlew assembleDebug

      # Создаем публичный предрелиз с тегом beta
      - name: Create Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta Build (Unstable)
          prerelease: true # Помечаем как предрелиз, чтобы он не путался со стабильным
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}